<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll Display</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --text: #f0f0f5;
      --muted: #8888aa;
      --accent: #6c63ff;
      --a: #e74c3c;
      --b: #3498db;
      --c: #2ecc71;
      --d: #f39c12;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen { width: 100%; height: 100%; display: none; position: relative; }
    .screen.active { display: flex; }

    /* Logo — pinned at top-center on open/results screens */
    .logo-header {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      height: 64px;
      width: auto;
      filter: invert(1);
      mix-blend-mode: screen;
    }

    /* Logo — large and inline on standby screen */
    .logo-standby {
      width: min(300px, 48vw);
      filter: invert(1);
      mix-blend-mode: screen;
    }

    /* ── STANDBY ── */
    #standby-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .standby-sub {
      font-size: 1.4rem;
      color: var(--muted);
    }

    .standby-dot-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .standby-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.3;
      animation: blink 1.4s ease-in-out infinite;
    }
    .standby-dot:nth-child(2) { animation-delay: 0.2s; }
    .standby-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* ── OPEN ── */
    #open-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 100px;
      gap: 40px;
    }

    .open-question-display {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      max-width: 900px;
    }

    .live-bars {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bar-row { display: flex; flex-direction: column; gap: 8px; }

    .bar-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .bar-track {
      height: 18px;
      background: var(--surface2);
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .bar-fill.opt-0 { background: var(--a); }
    .bar-fill.opt-1 { background: var(--b); }
    .bar-fill.opt-2 { background: var(--c); }
    .bar-fill.opt-3 { background: var(--d); }

    /* ── RESULTS ── */
    #results-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 80px;
      gap: 0;
    }

    .results-heading {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      text-align: center;
      margin-bottom: 36px;
      line-height: 1.3;
      max-width: 900px;
    }

    .results-bars-display {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 28px;
    }

    .r-row {
      background: var(--surface);
      border-radius: 14px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .r-row.winner { outline: 3px solid; }
    .r-row.winner.opt-0 { outline-color: var(--a); }
    .r-row.winner.opt-1 { outline-color: var(--b); }
    .r-row.winner.opt-2 { outline-color: var(--c); }
    .r-row.winner.opt-3 { outline-color: var(--d); }

    .r-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .r-row.opt-0 .r-badge { background: var(--a); }
    .r-row.opt-1 .r-badge { background: var(--b); }
    .r-row.opt-2 .r-badge { background: var(--c); }
    .r-row.opt-3 .r-badge { background: var(--d); }

    .r-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .r-text { font-size: 1.15rem; font-weight: 600; }

    .r-track {
      height: 10px;
      background: var(--surface2);
      border-radius: 6px;
      overflow: hidden;
    }

    .r-fill {
      height: 100%;
      border-radius: 6px;
      width: 0;
      transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .r-row.opt-0 .r-fill { background: var(--a); }
    .r-row.opt-1 .r-fill { background: var(--b); }
    .r-row.opt-2 .r-fill { background: var(--c); }
    .r-row.opt-3 .r-fill { background: var(--d); }

    .r-pct {
      font-size: 1.8rem;
      font-weight: 800;
      min-width: 72px;
      text-align: right;
    }

    .results-total-display {
      font-size: 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- STANDBY -->
  <div id="standby-screen" class="screen active">
    <img src="/logo.png" class="logo-standby" alt="TriHarder Film Festival">
    <div class="standby-sub">A question is coming up...</div>
    <div class="standby-dot-row">
      <div class="standby-dot"></div>
      <div class="standby-dot"></div>
      <div class="standby-dot"></div>
    </div>
  </div>

  <!-- OPEN: question + bars only, no QR, no counts -->
  <div id="open-screen" class="screen">
    <img src="/logo.png" class="logo-header" alt="TriHarder Film Festival">
    <div class="open-question-display" id="open-question-display"></div>
    <div class="live-bars" id="live-bars"></div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen" class="screen">
    <img src="/logo.png" class="logo-header" alt="TriHarder Film Festival">
    <div class="results-heading" id="results-heading"></div>
    <div class="results-bars-display" id="results-bars-display"></div>
    <div class="results-total-display" id="results-total-display"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const LABELS = ['A', 'B', 'C', 'D'];
    const socket = io();

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function buildLiveBars(options) {
      const container = document.getElementById('live-bars');
      container.innerHTML = options.map((opt, i) => `
        <div class="bar-row">
          <div class="bar-label">${LABELS[i]} — ${opt}</div>
          <div class="bar-track">
            <div class="bar-fill opt-${i}" id="lbar-${i}" style="width:0%"></div>
          </div>
        </div>
      `).join('');
    }

    function updateLiveBars(answers, totalVotes) {
      answers.forEach((count, i) => {
        const pct = totalVotes > 0 ? (count / totalVotes * 100).toFixed(0) : 0;
        const bar = document.getElementById(`lbar-${i}`);
        if (bar) bar.style.width = pct + '%';
      });
    }

    function showResults({ question, options, answers, totalVotes }) {
      document.getElementById('results-heading').textContent = question;
      document.getElementById('results-total-display').textContent =
        `${totalVotes} ${totalVotes === 1 ? 'vote' : 'votes'} total`;

      const maxVotes = Math.max(...answers);
      const winnerIdx = answers.indexOf(maxVotes);

      const container = document.getElementById('results-bars-display');
      container.innerHTML = options.map((opt, i) => {
        const pct = totalVotes > 0 ? Math.round(answers[i] / totalVotes * 100) : 0;
        const isWinner = i === winnerIdx && maxVotes > 0;
        return `
          <div class="r-row opt-${i}${isWinner ? ' winner' : ''}">
            <div class="r-badge">${LABELS[i]}</div>
            <div class="r-col">
              <div class="r-text">${opt}</div>
              <div class="r-track">
                <div class="r-fill" data-pct="${pct}" id="rfill-${i}"></div>
              </div>
            </div>
            <div class="r-pct">${pct}%</div>
          </div>
        `;
      }).join('');

      requestAnimationFrame(() => requestAnimationFrame(() => {
        options.forEach((_, i) => {
          const fill = document.getElementById(`rfill-${i}`);
          if (fill) fill.style.width = fill.dataset.pct + '%';
        });
      }));

      showScreen('results-screen');
    }

    socket.on('state_sync', ({ status, question, options, answers, totalVotes }) => {
      if (status === 'open') {
        document.getElementById('open-question-display').textContent = question;
        buildLiveBars(options);
        updateLiveBars(answers, totalVotes);
        showScreen('open-screen');
      } else if (status === 'closed') {
        showResults({ question, options, answers, totalVotes });
      }
    });

    socket.on('poll_started', ({ question, options }) => {
      document.getElementById('open-question-display').textContent = question;
      buildLiveBars(options);
      updateLiveBars(new Array(options.length).fill(0), 0);
      showScreen('open-screen');
    });

    socket.on('vote_update', ({ answers, totalVotes }) => {
      updateLiveBars(answers, totalVotes);
    });

    socket.on('poll_closed', (data) => {
      showResults(data);
    });

    socket.on('poll_reset', () => {
      showScreen('standby-screen');
    });
  </script>
</body>
</html>
