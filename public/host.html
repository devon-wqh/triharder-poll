<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll Host</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --text: #f0f0f5;
      --muted: #8888aa;
      --accent: #6c63ff;
      --accent-hover: #8078ff;
      --danger: #e74c3c;
      --a: #e74c3c;
      --b: #3498db;
      --c: #2ecc71;
      --d: #f39c12;
      --e: #9b59b6;
      --f: #1abc9c;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 24px; text-align: center; }

    .screen { width: 100%; max-width: 700px; display: none; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* ── SETUP SCREEN ── */
    .form-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid #333355;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    .form-group { margin-bottom: 20px; }

    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-row:nth-child(1) .option-badge { background: var(--a); }
    .option-row:nth-child(2) .option-badge { background: var(--b); }
    .option-row:nth-child(3) .option-badge { background: var(--c); }
    .option-row:nth-child(4) .option-badge { background: var(--d); }
    .option-row:nth-child(5) .option-badge { background: var(--e); }
    .option-row:nth-child(6) .option-badge { background: var(--f); }

    .remove-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .remove-btn:hover { color: var(--danger); background: rgba(231,76,60,0.1); }

    .add-btn {
      background: none;
      border: 1px dashed #444466;
      color: var(--muted);
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
      width: 100%;
    }

    .add-btn:hover { border-color: var(--accent); color: var(--accent); }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 24px;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #c0392b; transform: translateY(-1px); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid #333355;
    }
    .btn-secondary:hover { background: #2a2a50; }

    /* ── OPEN SCREEN ── */
    .open-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 560px) {
      .open-layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
    }

    .join-url {
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
    }

    .vote-count-big {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
    }

    .vote-label { font-size: 0.9rem; color: var(--muted); }

    .live-bars { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    .bar-row { display: flex; flex-direction: column; gap: 4px; }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .bar-option-label { color: var(--muted); font-weight: 600; }
    .bar-count { color: var(--text); }

    .bar-track {
      height: 10px;
      background: var(--surface2);
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease;
    }

    .bar-fill.opt-0 { background: var(--a); }
    .bar-fill.opt-1 { background: var(--b); }
    .bar-fill.opt-2 { background: var(--c); }
    .bar-fill.opt-3 { background: var(--d); }
    .bar-fill.opt-4 { background: var(--e); }
    .bar-fill.opt-5 { background: var(--f); }

    .open-footer { width: 100%; margin-top: 20px; }

    /* ── RESULTS SCREEN ── */
    .results-question {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .results-bars {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .result-row {
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }

    .result-bar-wrap {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .result-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .result-row:nth-child(1) .result-badge { background: var(--a); }
    .result-row:nth-child(2) .result-badge { background: var(--b); }
    .result-row:nth-child(3) .result-badge { background: var(--c); }
    .result-row:nth-child(4) .result-badge { background: var(--d); }
    .result-row:nth-child(5) .result-badge { background: var(--e); }
    .result-row:nth-child(6) .result-badge { background: var(--f); }

    .result-text-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .result-option-text { font-size: 0.95rem; font-weight: 500; }

    .result-track {
      height: 8px;
      background: var(--surface2);
      border-radius: 6px;
      overflow: hidden;
    }

    .result-fill {
      height: 100%;
      border-radius: 6px;
      width: 0;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .result-row:nth-child(1) .result-fill { background: var(--a); }
    .result-row:nth-child(2) .result-fill { background: var(--b); }
    .result-row:nth-child(3) .result-fill { background: var(--c); }
    .result-row:nth-child(4) .result-fill { background: var(--d); }
    .result-row:nth-child(5) .result-fill { background: var(--e); }
    .result-row:nth-child(6) .result-fill { background: var(--f); }

    .result-winner .result-fill { box-shadow: 0 0 10px currentColor; }

    .result-pct {
      font-size: 1.2rem;
      font-weight: 700;
      min-width: 48px;
      text-align: right;
    }

    .results-total {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .winner-label {
      font-size: 1rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <h1 style="margin-bottom:24px;">Create a Poll</h1>
    <div class="form-card">
      <div class="form-group">
        <label for="question-input">Question</label>
        <textarea id="question-input" rows="3" placeholder="e.g. What is the best recovery drink?"></textarea>
      </div>
      <div class="form-group">
        <label>Answer Options (2–6)</label>
        <div class="options-list" id="options-list">
          <div class="option-row">
            <div class="option-badge">A</div>
            <input type="text" class="option-input" placeholder="Option A">
            <button class="remove-btn" onclick="removeOption(this)" title="Remove">✕</button>
          </div>
          <div class="option-row">
            <div class="option-badge">B</div>
            <input type="text" class="option-input" placeholder="Option B">
            <button class="remove-btn" onclick="removeOption(this)" title="Remove">✕</button>
          </div>
        </div>
        <button class="add-btn" id="add-option-btn" onclick="addOption()">+ Add Option</button>
      </div>
      <button class="btn btn-primary" onclick="openPoll()">Open Voting</button>
    </div>
  </div>

  <!-- OPEN SCREEN -->
  <div id="open-screen" class="screen">
    <h2 id="open-question"></h2>
    <div class="open-layout">
      <div class="panel">
        <img id="qr-img" class="qr-img" src="" alt="QR Code">
        <p class="join-url" id="join-url"></p>
      </div>
      <div class="panel">
        <div class="vote-count-big" id="live-count">0</div>
        <div class="vote-label">votes received</div>
        <div class="live-bars" id="live-bars"></div>
      </div>
    </div>
    <div class="open-footer">
      <button class="btn btn-danger" onclick="closePoll()">Close &amp; Show Results</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="screen">
    <div class="results-question" id="results-question"></div>
    <div class="results-bars" id="results-bars"></div>
    <div class="results-total" id="results-total"></div>
    <div class="winner-label" id="winner-label"></div>
    <button class="btn btn-secondary" style="max-width:300px;" onclick="newPoll()">Start New Poll</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const LABELS = ['A', 'B', 'C', 'D', 'E', 'F'];
    const MAX_OPTIONS = 6;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ── SETUP ──

    function addOption() {
      const list = document.getElementById('options-list');
      const count = list.children.length;
      if (count >= MAX_OPTIONS) return;
      const row = document.createElement('div');
      row.className = 'option-row';
      row.innerHTML = `
        <div class="option-badge">${LABELS[count]}</div>
        <input type="text" class="option-input" placeholder="Option ${LABELS[count]}">
        <button class="remove-btn" onclick="removeOption(this)" title="Remove">✕</button>
      `;
      list.appendChild(row);
      if (count + 1 >= MAX_OPTIONS) document.getElementById('add-option-btn').style.display = 'none';
    }

    function removeOption(btn) {
      const list = document.getElementById('options-list');
      if (list.children.length <= 2) return;
      btn.parentElement.remove();
      rebuildOptionLabels();
      document.getElementById('add-option-btn').style.display = '';
    }

    function rebuildOptionLabels() {
      const rows = document.querySelectorAll('#options-list .option-row');
      rows.forEach((row, i) => {
        row.querySelector('.option-badge').textContent = LABELS[i];
        row.querySelector('.option-input').placeholder = `Option ${LABELS[i]}`;
      });
    }

    function openPoll() {
      const question = document.getElementById('question-input').value.trim();
      const inputs = document.querySelectorAll('#options-list .option-input');
      const options = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);

      if (!question) { alert('Please enter a question.'); return; }
      if (options.length < 2) { alert('Please enter at least 2 options.'); return; }

      socket.emit('start_poll', { question, options });
    }

    function closePoll() {
      if (!confirm('Close submissions and show results?')) return;
      socket.emit('close_poll');
    }

    function newPoll() {
      socket.emit('reset_poll');
    }

    // ── LIVE BARS ──

    function buildLiveBars(options) {
      const container = document.getElementById('live-bars');
      container.innerHTML = options.map((opt, i) => `
        <div class="bar-row">
          <div class="bar-meta">
            <span class="bar-option-label">${LABELS[i]} — ${opt}</span>
            <span class="bar-count" id="live-count-${i}">0</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill opt-${i}" id="live-bar-${i}" style="width:0%"></div>
          </div>
        </div>
      `).join('');
    }

    function updateLiveBars(answers, totalVotes) {
      document.getElementById('live-count').textContent = totalVotes;
      answers.forEach((count, i) => {
        const pct = totalVotes > 0 ? (count / totalVotes * 100).toFixed(0) : 0;
        const bar = document.getElementById(`live-bar-${i}`);
        const label = document.getElementById(`live-count-${i}`);
        if (bar) bar.style.width = pct + '%';
        if (label) label.textContent = count;
      });
    }

    // ── RESULTS ──

    function showResults({ question, options, answers, totalVotes }) {
      document.getElementById('results-question').textContent = question;
      document.getElementById('results-total').textContent =
        `${totalVotes} ${totalVotes === 1 ? 'vote' : 'votes'} total`;

      const maxVotes = Math.max(...answers);
      const winnerIdx = answers.indexOf(maxVotes);

      const container = document.getElementById('results-bars');
      container.innerHTML = options.map((opt, i) => {
        const pct = totalVotes > 0 ? Math.round(answers[i] / totalVotes * 100) : 0;
        const isWinner = i === winnerIdx && maxVotes > 0;
        return `
          <div class="result-row${isWinner ? ' result-winner' : ''}">
            <div class="result-bar-wrap">
              <div class="result-badge">${LABELS[i]}</div>
              <div class="result-text-col">
                <div class="result-option-text">${opt}</div>
                <div class="result-track">
                  <div class="result-fill" data-pct="${pct}" id="rfill-${i}"></div>
                </div>
              </div>
              <div class="result-pct">${pct}%</div>
            </div>
          </div>
        `;
      }).join('');

      if (totalVotes > 0) {
        document.getElementById('winner-label').textContent =
          `Winner: ${LABELS[winnerIdx]} — ${options[winnerIdx]}`;
      }

      // Animate bars after a tick
      requestAnimationFrame(() => requestAnimationFrame(() => {
        options.forEach((_, i) => {
          const fill = document.getElementById(`rfill-${i}`);
          if (fill) fill.style.width = fill.dataset.pct + '%';
        });
      }));

      showScreen('results-screen');
    }

    // ── SOCKET EVENTS ──

    socket.on('state_sync', ({ status, question, options, answers, totalVotes }) => {
      if (status === 'open') {
        document.getElementById('open-question').textContent = question;
        buildLiveBars(options);
        updateLiveBars(answers, totalVotes);
        fetchQR();
        showScreen('open-screen');
      } else if (status === 'closed') {
        showResults({ question, options, answers, totalVotes });
      }
    });

    socket.on('poll_started', ({ question, options }) => {
      document.getElementById('open-question').textContent = question;
      buildLiveBars(options);
      updateLiveBars(new Array(options.length).fill(0), 0);
      fetchQR();
      showScreen('open-screen');
    });

    socket.on('vote_update', ({ answers, totalVotes }) => {
      updateLiveBars(answers, totalVotes);
    });

    socket.on('poll_closed', (data) => {
      showResults(data);
    });

    socket.on('poll_reset', () => {
      document.getElementById('question-input').value = '';
      document.querySelectorAll('.option-input').forEach(i => i.value = '');
      showScreen('setup-screen');
    });

    async function fetchQR() {
      const res = await fetch('/api/qr');
      const { dataURL, url } = await res.json();
      document.getElementById('qr-img').src = dataURL;
      document.getElementById('join-url').textContent = url;
    }
  </script>
</body>
</html>
